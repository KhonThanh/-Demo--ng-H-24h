<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon | Đăng nhập</title>
    <link rel="icon" type="image/png" href="./img/logo/logo-favicon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- <link rel="stylesheet" href="../css/style.min.css"> -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/custom.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/utility.css">
</head>

<body>
    <header class="container-f bg-black" data-include="./component/header.html"></header>
    <main class="container-f flex flex-col center-hor">
        <section class="flex bg-gray container-f">
            <div class=" container-l nav-bar__container">
                <a href="javascript:void(0)" class="nav-bar__item">Trang chủ</a>
                <a href="javascript:void(0)" class="nav-bar__item">Đăng nhập</a>
            </div>
        </section>
        <section class="container-f flex center-ver container-padding">
            <div class="auth-section container-xxs flex flex-col gap-20 center-ver item-padding-30 border-radius-5 custom-item__low" id="section-login">

                <div class="auth-section__logo">
                    <img src="./img/logo/logo-dongho.svg" alt="Logo">
                </div>

                <div class="flex flex-col gap-10 center-ver">
                    <h3 class="auth-title bold">Đăng nhập tài khoản</h3>
                    <p class="text-sm text-color-deactive text-center">Vui lòng nhập thông tin đăng nhập</p>
                </div>

                <form class="js-validate-form flex flex-col gap-20 col-1" data-form="login">

                    <div class="flex flex-col gap-5 form-group">
                        <label class="bold text-sm">Tài khoản</label>
                        <input type="text" name="username" placeholder="Nhập tài khoản" required autocomplete="username"
                            data-msg="Vui lòng nhập tài khoản"
                            class="form-control item-padding-10-20 border-radius-5 bg-white-secondary border-none fill-view">
                        <span class="error-msg text-red text-xs"></span>
                    </div>

                    <div class="flex flex-col gap-5 form-group">
                        <label class="bold text-sm">Mật khẩu</label>
                        <input type="password" name="password" placeholder="Nhập mật khẩu" required minlength="6"
                            autocomplete="current-password" data-msg="Mật khẩu tối thiểu 6 ký tự"
                            class="form-control item-padding-10-20 border-radius-5 bg-white-secondary border-none fill-view">
                        <span class="error-msg text-red text-xs"></span>
                    </div>

                    <div class="flex right-hor">
                        <a href="../forgetpass.html" class="text-sm bold cursor-pointer">Quên mật khẩu?</a>
                    </div>

                    <div class="flex flex-col gap-10">
                        <button type="submit"
                            class="bg-primary text-color-white border-radius-5 bold uppercase cursor-pointer item-padding-10-20 border-none col-1">
                            Đăng nhập
                        </button>
                        <p class="text-center text-sm">Bạn chưa có tài khoản? <u><a href="./signin.html"
                                    class="bold">Đăng ký ngay</a></u></p>
                    </div>

                </form>
            </div>
        </section>
    </main>
    <footer class="container-f bg-black center-ver flex flex-col item-padding-60-0 gap-30"
        data-include="./component/footer.html"></footer>
    <script defer type="text/javascript" src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
    <script defer type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script defer type="text/javascript" src="./js/frontend.js"></script>
</body>

</html>
