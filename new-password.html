<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon | Xác thực OTP</title>
    <link rel="icon" type="image/png" href="./img/logo/logo-favicon.png">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- <link rel="stylesheet" href="../css/style.min.css"> -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/custom.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/utility.css">
</head>

<body>
    <header class="container-f bg-black" data-include="./component/header.html"></header>
    <main class="container-f flex flex-col center-hor">
        <section class="flex bg-gray container-f">
            <div class=" container-l nav-bar__container">
                <a href="javascript:void(0)" class="nav-bar__item">Trang chủ</a>
                <a href="javascript:void(0)" class="nav-bar__item">Đăng nhập</a>
            </div>
        </section>
        <section class="container-f flex center-ver container-padding">
            <div class="auth-section item-padding-30 border-radius-5 custom-item__low container-xxs flex flex-col gap-20 center-ver" id="section-new-password">

                <div class="auth-section__logo">
                    <img src="/img/logo/logo-dongho.svg" alt="Logo">
                </div>

                <div class="flex flex-col gap-10 center-ver">
                    <h3 class="auth-title bold">Tạo mật khẩu mới</h3>
                    <p class="text-sm text-color-deactive text-center">Nhập mật khẩu mới của bồ và bảo mật nó thật kỹ
                        nhé!</p>
                </div>

                <form class="js-validate-form flex flex-col gap-20 col-1" data-form="new-password" novalidate>

                    <div class="form-group flex flex-col gap-5">
                        <label class="text-sm bold">Mật khẩu mới</label>
                        <input type="password" name="password" id="new-password"
                            class="form-control item-padding-10-20 border-radius-5 bg-white-secondary border-none fill-view"
                            placeholder="Mật khẩu mới" required minlength="6"
                            data-msg="Mật khẩu phải từ 6 ký tự trở lên">
                        <span class="error-msg text-red text-xs"></span>
                    </div>

                    <div class="form-group flex flex-col gap-5">
                        <label class="text-sm bold">Xác nhận mật khẩu</label>
                        <input type="password" name="confirm_password"
                            class="form-control item-padding-10-20 border-radius-5 bg-white-secondary border-none fill-view"
                            placeholder="Nhập lại mật khẩu" required data-match="new-password"
                            data-msg="Mật khẩu không khớp">
                        <span class="error-msg text-red text-xs"></span>
                    </div>

                    <button type="submit"
                        class="bg-primary text-color-white bold uppercase cursor-pointer item-padding-10-20 border-radius-5 border-none col-1">
                        Lưu mật khẩu
                    </button>

                </form>
            </div>
        </section>
    </main>
    <footer class="container-f bg-white center-ver" data-include="./component/footer.html"></footer>
    <script defer type="text/javascript" src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
    <script defer type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script defer type="text/javascript" src="./js/frontend.js"></script>
</body>

</html>
