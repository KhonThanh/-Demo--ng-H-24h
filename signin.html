<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon | Đăng ký</title>
    <link rel="icon" type="image/png" href="./img/logo/logo-favicon.png">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- <link rel="stylesheet" href="../css/style.min.css"> -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/custom.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/utility.css">
</head>

<body>
    <header class="container-f bg-black" data-include="./component/header.html"></header>
    <main class="container-f flex flex-col center-hor">
        <section class="flex bg-gray container-f">
            <div class=" container-l nav-bar__container">
                <a href="javascript:void(0)" class="nav-bar__item">Trang chủ</a>
                <a href="javascript:void(0)" class="nav-bar__item">Đăng ký</a>
            </div>
        </section>
        <section class="container-f flex center-ver container-padding">
            <div class="auth-section container-xxs flex flex-col gap-10 center-ver item-padding-30 border-radius-5 custom-item__low" id="section-register">

                <div class="auth-section__logo">
                    <img src="./img/logo/logo-dongho.svg" alt="Logo">
                </div>

                <h3 class="auth-title  bold">Đăng ký tài khoản</h3>

                <form class="js-validate-form flex flex-col gap-20 col-1" data-form="register">

                    <div class="flex flex-col gap-5 form-group">
                        <label class="bold text-sm">Tài khoản</label>
                        <input type="text" name="username" placeholder="Nhập tài khoản" required minlength="4"
                            data-msg="Tài khoản tối thiểu 4 ký tự" autocomplete="username"
                            class="form-control item-padding-10-20 border-radius-5 bg-white-secondary border-none fill-view">
                        <span class="error-msg text-red text-xs"></span>
                    </div>

                    <div class="flex flex-col gap-5 form-group">
                        <label class="bold text-sm">Mật khẩu</label>
                        <input type="password" name="password" placeholder="Nhập mật khẩu" required minlength="6"
                            data-msg="Mật khẩu tối thiểu 6 ký tự" autocomplete="new-password"
                            class="form-control item-padding-10-20 border-radius-5 bg-white-secondary border-none fill-view">
                        <span class="error-msg text-red text-xs"></span>
                    </div>

                    <div class="flex flex-col gap-5 form-group">
                        <label class="bold text-sm">Nhập lại mật khẩu</label>
                        <input type="password" name="confirmPassword" placeholder="Nhập lại mật khẩu" required
                            data-match="password" data-msg="Mật khẩu không khớp"
                            class="form-control item-padding-10-20 border-radius-5 bg-white-secondary border-none fill-view">
                        <span class="error-msg text-red text-xs"></span>
                    </div>

                    <div class="flex flex-col gap-5 form-group">
                        <label class="bold text-sm">Số điện thoại</label>
                        <input type="tel" name="phone" placeholder="Nhập số điện thoại" required pattern="^0\d{9}$"
                            data-msg="Số điện thoại không hợp lệ"
                            class="form-control item-padding-10-20 border-radius-5 bg-white-secondary border-none fill-view">
                        <span class="error-msg text-red text-xs"></span>
                    </div>

                    <div class="flex flex-col gap-5 form-group">
                        <label class="bold text-sm">Email</label>
                        <input type="email" name="email" placeholder="Nhập email" required data-msg="Email không hợp lệ"
                            autocomplete="email"
                            class="form-control item-padding-10-20 border-radius-5 bg-white-secondary border-none fill-view">
                        <span class="error-msg text-red text-xs"></span>
                    </div>

                    <div class="flex flex-col gap-5 form-group">
                        <label class="flex center-ver gap-10 cursor-pointer">
                            <input type="checkbox" name="agree" required class="form-control"
                                data-msg="Vui lòng đồng ý với điều khoản">
                            <span class="text-sm">
                                Tôi đồng ý với
                                <a href="javascript:void(0)" class="bold">Điều khoản dịch vụ</a>
                                và
                                <a href="javascript:void(0)" class="bold">Chính sách bảo mật</a>
                            </span>
                        </label>
                        <span class="error-msg text-red text-xs"></span>
                    </div>

                    <div class="flex flex-col gap-5 form-group">
                        <label
                            class="fake-recaptcha flex center-ver gap-10 bg-white-secondary item-padding-10 border-radius-5 cursor-pointer">
                            <input type="checkbox" name="captcha" required class="form-control"
                                data-msg="Vui lòng xác minh captcha">
                            <span class="text-sm">I'm not a robot</span>
                        </label>
                        <span class="error-msg text-red text-xs"></span>
                    </div>

                    <div class="flex flex-col gap-10">
                        <button type="submit"
                            class="bg-primary text-color-white border-radius-5 bold uppercase cursor-pointer btn-padding border-none col-1">
                            Đăng ký
                        </button>
                        <p class="text-center text-sm">Bạn có tài khoản rồi? <u><a href="./login.html" class="bold">Đăng
                                    nhập ngay</a></u></p>
                    </div>

                </form>
            </div>
        </section>
    </main>
    <footer class="container-f bg-black center-ver flex flex-col item-padding-60-0 gap-30"
        data-include="./component/footer.html"></footer>
    <script defer type="text/javascript" src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
    <script defer type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script defer type="text/javascript" src="./js/frontend.js"></script>
</body>

</html>
